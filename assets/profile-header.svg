<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anshuman Raj — Computer Science and Engineering</title>
  <desc id="desc">A sleek navy developer banner with a subtle straw hat and pirate ship motif inspired by One Piece.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F1C"/>
      <stop offset=".56" stop-color="#12253A"/>
      <stop offset="1" stop-color="#123D49"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D69B42"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#F6C978" stop-opacity=".25"/>
      <stop offset="1" stop-color="#F6C978" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C6E8F5" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <circle cx="950" cy="158" r="250" fill="url(#sun)"/>
    <path d="M0 286 C160 250 270 316 430 281 S710 257 850 290 S1070 318 1200 275 V360 H0Z" fill="#071522" opacity=".72"/>
    <path d="M0 285 C165 248 280 313 438 280 S715 255 860 290 S1075 315 1200 274" fill="none" stroke="url(#blue)" stroke-width="2" opacity=".55"/>
    <path d="M0 316 C175 285 310 343 480 310 S760 285 910 317 S1090 340 1200 309" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity=".18"/>

    <rect x="76" y="82" width="4" height="142" rx="2" fill="url(#blue)"/>
    <text x="108" y="145" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="1.4">ANSHUMAN RAJ</text>
    <path d="M110 174 H222" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="213" fill="#C8D5E3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="1.15">COMPUTER SCIENCE &amp; ENGINEERING</text>
    <text x="110" y="253" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2.6">DREAM  ·  BUILD  ·  EXPLORE</text>

    <!-- Distant ship and pirate flag: a quiet One Piece-inspired detail -->
    <g transform="translate(915 208)" opacity=".82">
      <path d="M-82 60 Q-24 73 55 59 L78 44 Q30 55 -60 47Z" fill="#081522" stroke="#6AAFC4" stroke-width="1.5"/>
      <path d="M-13 48 V-63" stroke="#9CC7D3" stroke-width="2"/>
      <path d="M-10 -56 Q31 -46 47 -9 L-10 -9Z" fill="#C8D8DE" opacity=".85"/>
      <path d="M-16 -43 Q-51 -33 -58 4 L-16 4Z" fill="#79A9B9" opacity=".6"/>
      <path d="M-12 -62 L23 -56 L-12 -46Z" fill="#D9E6EA"/>
      <path d="M-13 -65 L-13 -88 L29 -82 L-13 -76Z" fill="#0A1320" stroke="#6C9BAE" stroke-width="1"/>
      <circle cx="5" cy="-81" r="4.3" fill="none" stroke="#DCE8EC" stroke-width="1.3"/>
      <path d="M1 -85 L-2 -89 M9 -85 L12 -89 M1 -77 L-2 -73 M9 -77 L12 -73" stroke="#DCE8EC" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M-34 62 Q-5 70 27 63" fill="none" stroke="#D69B42" stroke-width="2" opacity=".6"/>
    </g>

    <!-- Straw hat with red band: understated nod to One Piece -->
    <g transform="translate(1060 116)">
      <ellipse cx="0" cy="25" rx="91" ry="17" fill="#081522" opacity=".45"/>
      <path d="M-69 20 Q-56 -32 -4 -43 Q47 -42 68 20 Q4 7 -69 20Z" fill="url(#gold)" stroke="#F7D98C" stroke-width="2"/>
      <path d="M-77 17 Q-8 -1 79 16 Q65 42 1 43 Q-57 41 -77 17Z" fill="#C58B3B" stroke="#F1D18B" stroke-width="2"/>
      <path d="M-62 16 Q1 3 66 16" fill="none" stroke="#B4534B" stroke-width="8" stroke-linecap="round"/>
      <path d="M-5 -39 Q4 -13 2 5" fill="none" stroke="#FBE5A9" stroke-width="2" opacity=".5"/>
    </g>
    <circle cx="1060" cy="116" r="118" fill="none" stroke="#67E8F9" stroke-width="1" opacity=".12"/>
    <circle cx="1060" cy="116" r="139" fill="none" stroke="#67E8F9" stroke-width="1" stroke-dasharray="2 9" opacity=".2"/>
    <text x="1060" y="310" text-anchor="middle" fill="#B5C7D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3" opacity=".8">SET SAIL</text>
  </g>
</svg>